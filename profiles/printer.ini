# PrusaSlicer configuration for Creality Ender-3 V2
# Printer and print settings (filament settings are in filament_*.ini)

# --- Printer ---
bed_shape = 0x0,235x0,235x235,0x235
max_print_height = 250
nozzle_diameter = 0.4
printer_technology = FFF

# Cura placeholders translated:
#   {material_bed_temperature_layer_0} -> [first_layer_bed_temperature]
#   {material_print_temperature_layer_0} -> [first_layer_temperature]
#   {machine_depth} (235mm) -> hardcoded as 235
start_gcode = ; Ender 3 Custom Start G-code\nM140 S[first_layer_bed_temperature] ; Set Heat Bed temperature\nM190 S[first_layer_bed_temperature] ; Wait for Heat Bed temperature\nM104 S140 ; start warming extruder to 140\nG28 ; Home all axes\nG29 ; Auto bed-level (BL-Touch)\nG92 E0 ; Reset Extruder\nM104 S[first_layer_temperature] ; Set Extruder temperature\nG1 X0.1 Y20 Z0.3 F5000.0 ; Move to start position\nM109 S[first_layer_temperature] ; Wait for Extruder temperature\nG1 X0.1 Y200.0 Z0.3 F1500.0 E15 ; Draw the first line\nG1 X0.4 Y200.0 Z0.3 F5000.0 ; Move to side a little\nG1 X0.4 Y20 Z0.3 F1500.0 E30 ; Draw the second line\nG92 E0 ; Reset Extruder\nG1 Z2.0 F3000 ; Move Z Axis up little to prevent scratching of Heat Bed\nG1 X5 Y20 Z0.3 F5000.0 ; Move over to prevent blob squish

end_gcode = G91 ;Relative positioning\nG1 E-2 F2700 ;Retract a bit\nG1 E-2 Z0.2 F2400 ;Retract and raise Z\nG1 X5 Y5 F3000 ;Wipe out\nG1 Z10 ;Raise Z more\nG90 ;Absolute positioning\n\nG1 X0 Y235 ;Present print\nM106 S0 ;Turn-off fan\nM104 S0 ;Turn-off hotend\nM140 S0 ;Turn-off bed\n\nM84 X Y E ;Disable all steppers but Z

# --- Print settings ---
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 4
fill_density = 20%
fill_pattern = gyroid
support_material = 0
support_material_auto = 1
support_material_buildplate_only = 0
support_material_threshold = 50
support_material_style = organic
support_material_top_contact_distance = 0.2
support_material_bottom_contact_distance = 0.2
support_material_xy_spacing = 60%
support_material_interface_layers = 3
support_material_interface_spacing = 0.2
draft_shield = disabled
brim_width = 0
skirt = 0